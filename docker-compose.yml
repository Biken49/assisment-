version: "3.9"

services:
  api:
    build: .
    container_name: node_api
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: energy_db
    env_file:
      - ./.env
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules   # ensures node_modules is container-only
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: energy_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d  # optional SQL scripts
    restart: unless-stopped

volumes:
  pg_data:
